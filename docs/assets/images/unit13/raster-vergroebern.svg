<title id="title">Gleicher Ausschnitt, gröbere Zellen</title>
<desc id="description">Ein 40 mal 40 Meter großer Ausschnitt mit sechzehn 10-Meter-Zellen wird durch Blockmittelwerte zu vier 20-Meter-Zellen. Aus 100,100,100,180 wird 120; der Höchstwert 320 verschwindet im Mittelwert 260.</desc>
