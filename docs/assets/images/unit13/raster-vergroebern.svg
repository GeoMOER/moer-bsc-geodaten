<text x="328" y="648" font-size="23" font-weight="400" fill="#263238" text-anchor="start">Maximum jetzt: 260 m</text>
<text x="24" y="818" font-size="23" font-weight="400" fill="#263238" text-anchor="start">Beispiel links oben: (100 + 100 + 100 + 180)</text>
<text x="24" y="850" font-size="23" font-weight="400" fill="#263238" text-anchor="start">/ 4 = 120 m. Kleine Details gehen verloren.</text>
<text x="24" y="882" font-size="23" font-weight="400" fill="#263238" text-anchor="start">Feineres Speichern holt die Details nicht zurück.</text>
<text x="24" y="914" font-size="23" font-weight="400" fill="#263238" text-anchor="start">Erfundene Höhen; keine Marburger Messwerte.</text>
