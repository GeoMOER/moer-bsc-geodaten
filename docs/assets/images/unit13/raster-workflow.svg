<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="450" viewBox="0 0 1000 450" role="img" aria-labelledby="title desc">
  <title id="title">Rasterwerte an Beobachtungspunkten abtasten</title>
  <desc id="desc">Ein Höhenraster besteht aus Zellen mit Werten. Ein Beobachtungspunkt liegt in der Zelle mit dem sichtbaren Wert 228 und übernimmt diesen Wert als Attribut hoehe_m.</desc>
  <rect width="1000" height="450" fill="#f7f8fa"/>
  <g font-family="sans-serif" fill="#263238">
    <text x="35" y="45" font-size="28" font-weight="700">Vom Rasterwert zum Punktattribut</text>
    <g transform="translate(55 85)" stroke="#fff" stroke-width="3">
      <g fill="#c5e1a5"><rect width="95" height="70"/><rect x="95" width="95" height="70"/><rect x="190" width="95" height="70"/></g>
      <g fill="#9ccc65"><rect x="285" width="95" height="70"/><rect y="70" width="95" height="70"/><rect x="95" y="70" width="95" height="70"/></g>
      <g fill="#7cb342"><rect x="190" y="70" width="95" height="70"/><rect x="285" y="70" width="95" height="70"/><rect y="140" width="95" height="70"/></g>
      <g fill="#558b2f"><rect x="95" y="140" width="95" height="70"/><rect x="190" y="140" width="95" height="70"/><rect x="285" y="140" width="95" height="70"/><rect y="210" width="95" height="70"/><rect x="95" y="210" width="95" height="70"/><rect x="190" y="210" width="95" height="70"/><rect x="285" y="210" width="95" height="70"/></g>
      <g fill="#263238" stroke="none" font-size="17" text-anchor="middle"><text x="48" y="42">180</text><text x="143" y="42">192</text><text x="238" y="42">205</text><text x="333" y="42">219</text><text x="48" y="112">201</text><text x="143" y="112">214</text><text x="238" y="112" font-weight="700">228</text><text x="333" y="112">241</text></g>
      <circle cx="211" cy="91" r="12" fill="#c62828" stroke="#fff"/>
    </g>
    <path d="M470 220H575" stroke="#1565c0" stroke-width="8"/><path d="m570 198 30 22-30 22" fill="#1565c0"/>
    <rect x="635" y="110" width="310" height="225" rx="12" fill="#fff" stroke="#455a64" stroke-width="3"/>
    <text x="670" y="155" font-size="22" font-weight="700">Punktattributtabelle</text>
    <text x="670" y="205" font-size="19">gbifID: 123…</text><text x="670" y="245" font-size="19">Art: …</text><text x="670" y="285" font-size="19" font-weight="700">hoehe_m: 228</text>
    <text x="95" y="390" font-size="17" font-weight="700">Der Punkt liegt in der Zelle mit dem Wert 228.</text>
    <text x="95" y="420" font-size="17">Zellgröße, DGM-Genauigkeit und Koordinatenunsicherheit begrenzen die Aussage.</text>
  </g>
</svg>
