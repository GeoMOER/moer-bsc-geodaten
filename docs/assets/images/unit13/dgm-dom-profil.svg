<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc">
  <title id="title">DGM und DOM im Profil derselben Landschaft</title>
  <desc id="desc">Zwei Profile zeigen denselben Hügel, Baum und dasselbe Gebäude. Links folgt die Höhenlinie des digitalen Geländemodells dem Boden unter Baum und Gebäude. Rechts folgt die Linie des digitalen Oberflächenmodells zusätzlich Baumkrone und Gebäudedach.</desc>
  <rect width="1000" height="430" fill="#f7f8fa"/>
  <g font-family="sans-serif" fill="#263238">
    <text x="35" y="42" font-size="27" font-weight="700">Dieselbe Landschaft, zwei Höhenmodelle</text>
    <text x="55" y="82" font-size="21" font-weight="700">DGM · Geländeoberfläche</text>
    <text x="545" y="82" font-size="21" font-weight="700">DOM · sichtbare Objektoberfläche</text>
    <g transform="translate(55 105)">
      <path d="M0 210 Q70 175 135 182 T255 135 T390 170 L390 245H0Z" fill="#dcedc8" stroke="#78909c" stroke-width="2"/>
      <rect x="278" y="90" width="72" height="67" fill="#ffe0b2" stroke="#795548" stroke-width="2"/><path d="M265 92 314 57 365 92Z" fill="#8d6e63"/><rect x="305" y="125" width="18" height="32" fill="#fff"/>
      <rect x="98" y="105" width="13" height="73" fill="#795548"/><circle cx="104" cy="87" r="43" fill="#66bb6a"/><circle cx="77" cy="108" r="28" fill="#66bb6a"/><circle cx="132" cy="108" r="30" fill="#66bb6a"/>
      <path d="M0 210 Q70 175 135 182 T255 135 T390 170" fill="none" stroke="#1565c0" stroke-width="6"/>
      <text x="15" y="270" font-size="17" fill="#1565c0" font-weight="700">Höhe des Bodens</text>
    </g>
    <g transform="translate(545 105)">
      <path d="M0 210 Q70 175 135 182 T255 135 T390 170 L390 245H0Z" fill="#dcedc8" stroke="#78909c" stroke-width="2"/>
      <rect x="278" y="90" width="72" height="67" fill="#ffe0b2" stroke="#795548" stroke-width="2"/><path d="M265 92 314 57 365 92Z" fill="#8d6e63"/><rect x="305" y="125" width="18" height="32" fill="#fff"/>
      <rect x="98" y="105" width="13" height="73" fill="#795548"/><circle cx="104" cy="87" r="43" fill="#66bb6a"/><circle cx="77" cy="108" r="28" fill="#66bb6a"/><circle cx="132" cy="108" r="30" fill="#66bb6a"/>
      <path d="M0 210 Q55 184 70 187 L70 108 Q78 57 104 44 Q132 61 143 108 L143 181 Q205 168 255 135 L265 92 314 57 365 92 365 163 Q380 166 390 170" fill="none" stroke="#c62828" stroke-width="6"/>
      <text x="15" y="270" font-size="17" fill="#c62828" font-weight="700">Höhe von Boden, Baumkrone und Dach</text>
    </g>
    <g font-size="16" fill="#455a64"><text x="55" y="405">Profile sind schematisch; entscheidend ist, welcher Oberfläche der Höhenwert folgt.</text></g>
  </g>
</svg>
