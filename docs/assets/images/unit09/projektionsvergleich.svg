  <title id="title">Berechneter Vergleich von World Mercator und Equal Earth</title>
  <desc id="desc">Dieselben geodätischen Referenzflächen mit 1000 Kilometern Radius liegen am Äquator und bei 70 Grad Nord. World Mercator vergrößert die polnahe Fläche stark. Equal Earth erhält die Flächenverhältnisse, verändert jedoch ihre Form.</desc>
