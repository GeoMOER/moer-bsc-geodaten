<title id="title">Gleiche Zahlen, anderer Ort</title>
<desc id="description">Im gleichen lon/lat-Gitter liegt A bei 8,77 Grad Ost und 50,81 Grad Nord. Nach Vertauschen liegt B bei 50,81 Grad Ost und 8,77 Grad Nord. Beide Paare sind formal gültig.</desc>
