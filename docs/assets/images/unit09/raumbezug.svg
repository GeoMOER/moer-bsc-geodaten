<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc">
  <title id="title">Von Tabellendaten zu Geodaten</title>
  <desc id="desc">Links steht eine Temperaturtabelle ohne Ortsangabe. Rechts ergänzt dieselbe Tabelle Koordinaten und verweist auf Punkte in einer schematischen Karte.</desc>
  <rect width="1000" height="420" fill="#f7f8fa"/>
  <g font-family="sans-serif" fill="#263238">
    <text x="55" y="52" font-size="26" font-weight="700">Daten ohne nutzbaren Raumbezug</text>
    <text x="565" y="52" font-size="26" font-weight="700">Geodaten</text>
    <g stroke="#78909c" fill="#fff">
      <rect x="55" y="85" width="360" height="205" rx="5"/>
      <path d="M55 135h360M55 185h360M55 235h360M235 85v205"/>
      <rect x="565" y="85" width="380" height="205" rx="5"/>
      <path d="M565 135h380M565 185h380M565 235h380M685 85v205M815 85v205"/>
    </g>
    <g font-size="19">
      <text x="82" y="118" font-weight="700">Datum</text><text x="260" y="118" font-weight="700">Temperatur</text>
      <text x="82" y="168">12.05.</text><text x="280" y="168">18,4 °C</text>
      <text x="82" y="218">13.05.</text><text x="280" y="218">17,9 °C</text>
      <text x="82" y="268">14.05.</text><text x="280" y="268">19,1 °C</text>
      <text x="585" y="118" font-weight="700">Temp.</text><text x="710" y="118" font-weight="700">Latitude</text><text x="835" y="118" font-weight="700">Longitude</text>
      <text x="590" y="168">18,4</text><text x="715" y="168">50.78</text><text x="845" y="168">8.77</text>
      <text x="590" y="218">17,9</text><text x="715" y="218">50.82</text><text x="845" y="218">8.73</text>
      <text x="590" y="268">19,1</text><text x="715" y="268">50.81</text><text x="845" y="268">8.79</text>
    </g>
    <path d="M445 188h82" stroke="#1565c0" stroke-width="7"/><path d="m525 168 25 20-25 20" fill="#1565c0"/>
    <text x="58" y="335" font-size="20">Wann wurde wie viel gemessen?</text>
    <text x="568" y="335" font-size="20">Zusätzlich: Wo wurde gemessen?</text>
    <text x="568" y="374" font-size="17" fill="#455a64">Raumbezug + Sachdaten ermöglichen räumliche Fragen.</text>
  </g>
</svg>
