<text x="44" y="108" font-size="25" font-weight="700" fill="#263238" text-anchor="start">A · Fläche über den Punkten</text>
<text x="44" y="151" font-size="22" font-weight="400" fill="#263238" text-anchor="start">Oben liegt vorne</text>
