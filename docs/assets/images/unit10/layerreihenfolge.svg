<text x="60" y="270" font-size="24" font-weight="400" fill="#263238" text-anchor="start">Punkte</text>
<rect x="285" y="147" width="303" height="170" fill="#eef3f6" stroke="#b7c4cc" stroke-width="1.5" rx="0"/>
<circle cx="371" cy="212" r="10" fill="#b45309" stroke="white" stroke-width="2"/>
<circle cx="495" cy="257" r="10" fill="#b45309" stroke="white" stroke-width="2"/>
<rect x="311" y="172" width="248" height="125" fill="#d0e5d9" stroke="#227564" stroke-width="2" rx="0"/>
<text x="301" y="341" font-size="22" font-weight="400" fill="#263238" text-anchor="start">gleicher Kartenausschnitt</text>
<rect x="24" y="374" width="592" height="280" fill="white" stroke="#b7c4cc" stroke-width="1.5" rx="10"/>
