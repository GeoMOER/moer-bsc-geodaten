<svg xmlns="http://www.w3.org/2000/svg" width="640" height="752" viewBox="0 0 640 752" role="img" aria-labelledby="title description">
<title id="title">Verdeckt heißt nicht gelöscht</title>
<desc id="description">Dieselben zwei Punkte liegen innerhalb einer deckend gefüllten Fläche. Liegt die Fläche über den Punkten, sind diese verdeckt; liegen die Punkte oben, sind sie sichtbar.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#263238"/></marker></defs>
