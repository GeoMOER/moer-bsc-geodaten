<rect x="44" y="474" width="190" height="50" fill="#eef3f6" stroke="#b7c4cc" stroke-width="1.5" rx="0"/>
<text x="60" y="507" font-size="24" font-weight="400" fill="#263238" text-anchor="start">Punkte</text>
