<text x="60" y="572" font-size="24" font-weight="400" fill="#263238" text-anchor="start">Fläche</text>
<rect x="285" y="449" width="303" height="170" fill="#eef3f6" stroke="#b7c4cc" stroke-width="1.5" rx="0"/>
<rect x="311" y="474" width="248" height="125" fill="#d0e5d9" stroke="#227564" stroke-width="2" rx="0"/>
