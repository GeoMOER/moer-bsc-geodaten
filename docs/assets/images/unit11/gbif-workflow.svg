<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-labelledby="title desc">
  <title id="title">Workflow vom GBIF-API-Snapshot zum geprüften Punktlayer</title>
  <desc id="desc">Fünf Schritte führen vom dokumentierten Kurs-Snapshot über Tabellenprüfung, Punktimport und Qualitätsregel zum dokumentierten Ergebnis. Der API-Snapshot hat keinen eigenen Download-DOI; angegeben wird der DOI des Quelldatensatzes. Ein eigener GBIF Occurrence Download mit eigenem DOI ist eine spätere Option.</desc>
  <rect width="1000" height="470" fill="#f7f8fa"/>
  <g font-family="sans-serif" fill="#263238">
    <text x="35" y="45" font-size="28" font-weight="700">Vom Kurs-Snapshot zum geprüften Punktlayer</text>
    <g font-size="18" text-anchor="middle">
      <g fill="#e3f2fd" stroke="#1565c0" stroke-width="3">
        <rect x="35" y="90" width="160" height="135" rx="12"/><rect x="228" y="90" width="160" height="135" rx="12"/><rect x="421" y="90" width="160" height="135" rx="12"/><rect x="614" y="90" width="160" height="135" rx="12"/><rect x="807" y="90" width="160" height="135" rx="12"/>
      </g>
      <text x="115" y="140">API-Snapshot</text><text x="115" y="174">übernehmen</text>
      <text x="308" y="140">Tabelle</text><text x="308" y="174">prüfen</text>
      <text x="501" y="140">Punkte</text><text x="501" y="174">importieren</text>
      <text x="694" y="140">Qualitätsregel</text><text x="694" y="174">anwenden</text>
      <text x="887" y="140">Ergebnis</text><text x="887" y="174">dokumentieren</text>
    </g>
    <g fill="#1565c0"><path d="m195 143 28 16-28 16z"/><path d="m388 143 28 16-28 16z"/><path d="m581 143 28 16-28 16z"/><path d="m774 143 28 16-28 16z"/></g>
    <rect x="35" y="260" width="930" height="105" rx="10" fill="#fff" stroke="#78909c" stroke-width="2"/>
    <g font-size="18">
      <text x="60" y="295" font-weight="700">Kurs-Snapshot:</text><text x="220" y="295">kein eigener GBIF-Download-DOI</text>
      <text x="60" y="328" font-weight="700">Quelldatensatz:</text><text x="220" y="328">DOI 10.15468/uc1apo</text>
      <text x="520" y="295" font-weight="700">Eigener Occurrence Download (Vertiefung):</text>
      <text x="520" y="328">erhält einen eigenen DOI.</text>
    </g>
    <text x="40" y="405" font-size="18">Rohdaten bleiben unverändert; Filterregel, ausgeschlossene Records und Unsicherheiten bleiben nachvollziehbar.</text>
    <text x="40" y="440" font-size="18" font-weight="700">Beobachtungsnachweise sind keine vollständige Verbreitungskarte.</text>
  </g>
</svg>
