<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-labelledby="t d"><title id="t">Workflow von GBIF-Daten zum geprüften Punktlayer</title><desc id="d">Fünf Schritte führen vom dokumentierten GBIF-Download über Tabellen- und Qualitätsprüfung zum geprüften Punktlayer und einer vorsichtigen Aussage.</desc><rect width="1000" height="420" fill="#f7f8fa"/><g font-family="sans-serif" fill="#263238"><text x="35" y="45" font-size="28" font-weight="700">Vom GBIF-Download zur räumlichen Aussage</text><g font-size="19" text-anchor="middle"><g fill="#e3f2fd" stroke="#1565c0" stroke-width="3"><rect x="35" y="105" width="160" height="150" rx="12"/><rect x="228" y="105" width="160" height="150" rx="12"/><rect x="421" y="105" width="160" height="150" rx="12"/><rect x="614" y="105" width="160" height="150" rx="12"/><rect x="807" y="105" width="160" height="150" rx="12"/></g><text x="115" y="155">Download</text><text x="115" y="190">+ DOI</text><text x="308" y="155">Tabelle</text><text x="308" y="190">prüfen</text><text x="501" y="155">Punkte</text><text x="501" y="190">importieren</text><text x="694" y="155">Qualität</text><text x="694" y="190">beurteilen</text><text x="887" y="155">Ergebnis</text><text x="887" y="190">dokumentieren</text></g><g fill="#1565c0"><path d="m195 168 28 18-28 18z"/><path d="m388 168 28 18-28 18z"/><path d="m581 168 28 18-28 18z"/><path d="m774 168 28 18-28 18z"/></g><text x="75" y="320" font-size="19">Rohdaten bleiben unverändert.</text><text x="75" y="355" font-size="19">Filterregeln, Ausschlüsse und Unsicherheiten bleiben nachvollziehbar.</text><text x="75" y="390" font-size="19" font-weight="700">Beobachtungsnachweise sind nicht automatisch eine vollständige Verbreitungskarte.</text></g></svg>
