<text x="44" y="695" font-size="22" font-weight="400" fill="#263238" text-anchor="start">Suchbereich blau hinterlegt · Weg gestrichelt</text>
<circle cx="36" cy="754" r="8" fill="#1565a7" stroke="white" stroke-width="2"/>
<text x="56" y="762" font-size="23" font-weight="400" fill="#263238" text-anchor="start">dokumentiert</text>
<circle cx="298" cy="754" r="8" fill="white" stroke="#68777e" stroke-width="2"/>
<text x="318" y="762" font-size="23" font-weight="400" fill="#263238" text-anchor="start">im Schema vorhanden</text>
<text x="24" y="804" font-size="23" font-weight="400" fill="#263238" text-anchor="start">In echten Nachweisdaten sind unentdeckte</text>
<text x="24" y="836" font-size="23" font-weight="400" fill="#263238" text-anchor="start">Vorkommen und Suchaufwand oft unbekannt.</text>
