<circle cx="491" cy="239" r="8" fill="white" stroke="#68777e" stroke-width="2"/>
<circle cx="131" cy="284" r="8" fill="#1565a7" stroke="white" stroke-width="2"/>
<circle cx="251" cy="284" r="8" fill="#1565a7" stroke="white" stroke-width="2"/>
<circle cx="371" cy="284" r="8" fill="#1565a7" stroke="white" stroke-width="2"/>
<circle cx="491" cy="284" r="8" fill="#1565a7" stroke="white" stroke-width="2"/>
<circle cx="131" cy="329" r="8" fill="white" stroke="#68777e" stroke-width="2"/>
<circle cx="251" cy="329" r="8" fill="white" stroke="#68777e" stroke-width="2"/>
<circle cx="371" cy="329" r="8" fill="white" stroke="#68777e" stroke-width="2"/>
<circle cx="491" cy="329" r="8" fill="white" stroke="#68777e" stroke-width="2"/>
<text x="44" y="395" font-size="22" font-weight="400" fill="#263238" text-anchor="start">Suchbereich blau hinterlegt · Weg gestrichelt</text>
<rect x="24" y="442" width="592" height="275" fill="white" stroke="#b7c4cc" stroke-width="1.5" rx="10"/>
<text x="44" y="478" font-size="25" font-weight="700" fill="#263238" text-anchor="start">B · Suche im ganzen Gebiet: 12 Nachweise</text>
<rect x="44" y="502" width="552" height="163" fill="#edf3ed" stroke="#b7c4cc" stroke-width="1.5" rx="0"/>
