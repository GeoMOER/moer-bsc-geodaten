<svg xmlns="http://www.w3.org/2000/svg" width="640" height="750" viewBox="0 0 640 750" role="img" aria-labelledby="title description">
<title id="title">Drei Records, zwei Positionen</title>
<desc id="description">Beispielrecords A und B besitzen dieselbe Position, aber unterschiedliche Termine. C liegt an einer zweiten Position. Drei Features können daher als zwei sichtbare Symbole erscheinen.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#263238"/></marker></defs>
<rect width="640" height="100%" fill="#f7f8fa"/>
<g font-family="sans-serif" fill="#263238">
<text x="24" y="42" font-size="28" font-weight="700" fill="#263238" text-anchor="start">Drei Records, zwei Positionen</text>
<rect x="24" y="72" width="592" height="210" fill="white" stroke="#b7c4cc" stroke-width="1.5" rx="10"/>
<text x="44" y="108" font-size="25" font-weight="700" fill="#263238" text-anchor="start">Tabelle · drei Beispielbeobachtungen</text>
<text x="44" y="151" font-size="23" font-weight="700" fill="#263238" text-anchor="start">ID</text>
<text x="130" y="151" font-size="23" font-weight="700" fill="#263238" text-anchor="start">Datum</text>
<text x="370" y="151" font-size="23" font-weight="700" fill="#263238" text-anchor="start">Position (x; y)</text>
<text x="44" y="193" font-size="24" font-weight="400" fill="#263238" text-anchor="start">A</text>
<text x="130" y="193" font-size="24" font-weight="400" fill="#263238" text-anchor="start">18.04.2026</text>
<text x="370" y="193" font-size="24" font-weight="400" fill="#263238" text-anchor="start">(20; 30)</text>
<text x="44" y="227" font-size="24" font-weight="400" fill="#263238" text-anchor="start">B</text>
<text x="130" y="227" font-size="24" font-weight="400" fill="#263238" text-anchor="start">02.05.2026</text>
<text x="370" y="227" font-size="24" font-weight="400" fill="#263238" text-anchor="start">(20; 30)</text>
<text x="44" y="261" font-size="24" font-weight="400" fill="#263238" text-anchor="start">C</text>
<text x="130" y="261" font-size="24" font-weight="400" fill="#263238" text-anchor="start">02.05.2026</text>
<text x="370" y="261" font-size="24" font-weight="400" fill="#263238" text-anchor="start">(70; 50)</text>
<rect x="24" y="310" width="592" height="264" fill="white" stroke="#b7c4cc" stroke-width="1.5" rx="10"/>
<text x="44" y="346" font-size="25" font-weight="700" fill="#263238" text-anchor="start">Karte · gleich große Punktsymbole</text>
<rect x="44" y="373" width="552" height="171" fill="#edf3ed" stroke="#b7c4cc" stroke-width="1.5" rx="0"/>
<circle cx="190" cy="478.0" r="12" fill="#1565a7" stroke="white" stroke-width="2"/>
<text x="212" y="468.0" font-size="25" font-weight="700" fill="#263238" text-anchor="start">A + B</text>
<circle cx="490" cy="428.0" r="12" fill="#1565a7" stroke="white" stroke-width="2"/>
<text x="512" y="418.0" font-size="25" font-weight="700" fill="#263238" text-anchor="start">C</text>
<text x="24" y="620" font-size="23" font-weight="400" fill="#263238" text-anchor="start">A und B liegen exakt übereinander.</text>
<text x="24" y="652" font-size="23" font-weight="400" fill="#263238" text-anchor="start">Anderer Termin: nicht sicher eine Dublette.</text>
<text x="24" y="684" font-size="23" font-weight="400" fill="#263238" text-anchor="start">Recordzahl ist nicht gleich Individuenzahl.</text>
<text x="24" y="716" font-size="23" font-weight="400" fill="#263238" text-anchor="start">Erfundene Daten in lokalen Koordinaten.</text>
</g>
</svg>
