<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="450" viewBox="0 0 1000 450" role="img" aria-labelledby="t d"><title id="t">Räumliche Beziehungen zwischen Punkten, Linien und Polygonen</title><desc id="d">Beobachtungspunkte und Gewässerlinien werden anhand ihrer räumlichen Beziehung zu Schutzgebietspolygonen ausgewählt.</desc><rect width="1000" height="450" fill="#f7f8fa"/><g font-family="sans-serif" fill="#263238"><text x="35" y="45" font-size="28" font-weight="700">Punkte, Linien und Polygone gemeinsam auswerten</text><rect x="55" y="85" width="560" height="305" rx="12" fill="#e3f2fd" stroke="#455a64" stroke-width="3"/><path d="M105 350C220 180 360 370 570 135" fill="none" stroke="#1976d2" stroke-width="11"/><path d="M250 120l260 35 35 150-185 55-150-115z" fill="#81c784" fill-opacity=".65" stroke="#2e7d32" stroke-width="4"/><g fill="#9e9e9e" stroke="#fff" stroke-width="3"><circle cx="130" cy="150" r="11"/><circle cx="180" cy="305" r="11"/><circle cx="575" cy="340" r="11"/></g><g fill="#c62828" stroke="#fff" stroke-width="3"><circle cx="310" cy="205" r="12"/><circle cx="410" cy="280" r="12"/><circle cx="475" cy="190" r="12"/></g><text x="655" y="120" font-size="21" font-weight="700">Räumliche Auswahl</text><text x="655" y="165" font-size="18">• Punkte im Schutzgebiet</text><text x="655" y="205" font-size="18">• Gewässer schneiden Fläche</text><text x="655" y="265" font-size="18" font-weight="700">Ergebnis sichern</text><text x="655" y="305" font-size="18">• Auswahl exportieren</text><text x="655" y="345" font-size="18">• Beziehung dokumentieren</text><text x="655" y="385" font-size="18">• Grenzfälle prüfen</text></g></svg>
