<text x="44" y="282" font-size="22" font-weight="400" fill="#263238" text-anchor="start">Punkte werden durch gerade Segmente verbunden.</text>
<text x="44" y="313" font-size="22" font-weight="400" fill="#263238" text-anchor="start">Endpunkte gleich; Details dazwischen verändern sich.</text>
