<svg xmlns="http://www.w3.org/2000/svg" width="640" height="715" viewBox="0 0 640 715" role="img" aria-labelledby="title description">
<title id="title">Stützpunkte bestimmen den Verlauf</title>
<desc id="description">Ein Linienzug aus neun Stützpunkten wird auf fünf dieser Punkte reduziert. Anfang und Ende bleiben erhalten, dazwischen entfallen Details.</desc>
