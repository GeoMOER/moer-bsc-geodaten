<svg xmlns="http://www.w3.org/2000/svg" width="640" height="805" viewBox="0 0 640 805" role="img" aria-labelledby="title description">
<title id="title">Loch oder getrennter Teil?</title>
<desc id="description">Ein Polygon mit innerem Ring besitzt eine ausgesparte Fläche. Ein Multipart-Feature besteht aus zwei getrennten gefüllten Polygonen. Beide Beispiele haben je eine Tabellenzeile.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#263238"/></marker></defs>
<rect width="640" height="100%" fill="#f7f8fa"/>
<g font-family="sans-serif" fill="#263238">
<text x="24" y="42" font-size="28" font-weight="700" fill="#263238" text-anchor="start">Loch oder getrennter Teil?</text>
<rect x="24" y="76" width="592" height="277" fill="white" stroke="#b7c4cc" stroke-width="1.5" rx="10"/>
<text x="44" y="112" font-size="25" font-weight="700" fill="#263238" text-anchor="start">A · Polygon mit Loch</text>
<path d="M55 145H305V280H55Z M132 181H230V248H132Z" fill="#d0e5d9" fill-rule="evenodd" stroke="#227564" stroke-width="3"/>
<text x="148" y="223" font-size="24" font-weight="400" fill="#263238" text-anchor="start">Loch</text>
<text x="332" y="185" font-size="23" font-weight="400" fill="#263238" text-anchor="start">Äußerer Ring</text>
<text x="332" y="217" font-size="23" font-weight="400" fill="#263238" text-anchor="start">Innerer Ring</text>
<text x="332" y="249" font-size="23" font-weight="400" fill="#263238" text-anchor="start">Loch ausgespart</text>
<rect x="44" y="296" width="550" height="40" fill="#eef3f6" stroke="#b7c4cc" stroke-width="1.5" rx="0"/>
<text x="56" y="324" font-size="23" font-weight="400" fill="#263238" text-anchor="start">ID A · 1 Feature · 1 Tabellenzeile</text>
<rect x="24" y="379" width="592" height="283" fill="white" stroke="#b7c4cc" stroke-width="1.5" rx="10"/>
<text x="44" y="415" font-size="25" font-weight="700" fill="#263238" text-anchor="start">B · Multipart-Feature</text>
<rect x="56" y="452" width="111" height="134" fill="#d0e5d9" stroke="#227564" stroke-width="3" rx="0"/>
<rect x="214" y="479" width="96" height="92" fill="#d0e5d9" stroke="#227564" stroke-width="3" rx="0"/>
<text x="84" y="530" font-size="26" font-weight="700" fill="#263238" text-anchor="start">B</text>
<text x="248" y="530" font-size="26" font-weight="700" fill="#263238" text-anchor="start">B</text>
<text x="332" y="485" font-size="23" font-weight="400" fill="#263238" text-anchor="start">Zwei getrennte</text>
<text x="332" y="517" font-size="23" font-weight="400" fill="#263238" text-anchor="start">Teile, aber</text>
<text x="332" y="549" font-size="23" font-weight="400" fill="#263238" text-anchor="start">ein Feature</text>
<rect x="44" y="605" width="550" height="40" fill="#eef3f6" stroke="#b7c4cc" stroke-width="1.5" rx="0"/>
<text x="56" y="633" font-size="23" font-weight="400" fill="#263238" text-anchor="start">ID B · 1 Feature · 1 Tabellenzeile</text>
<text x="24" y="709" font-size="23" font-weight="400" fill="#263238" text-anchor="start">Grün: Fläche, die zur Geometrie gehört.</text>
<text x="24" y="741" font-size="23" font-weight="400" fill="#263238" text-anchor="start">Weiß: Loch oder Raum zwischen den Teilen.</text>
<text x="24" y="773" font-size="23" font-weight="400" fill="#263238" text-anchor="start">Schematische Geometrien, keine realen Gebiete.</text>
</g>
</svg>
