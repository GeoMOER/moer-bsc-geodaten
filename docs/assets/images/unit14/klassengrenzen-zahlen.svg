<title id="title">Gleiche Werte, andere Klassen</title>
<desc id="description">Zehn Höhen von 100,110,120,130,140,150,160,170,190,500 Metern in fünf Klassen. Gleiche Intervalle haben 8,1,0,0,1 Werte je Klasse, Quantile je zwei. Die Bandbreiten auf der Zahlenachse entsprechen den numerischen Klassenbreiten.</desc>
