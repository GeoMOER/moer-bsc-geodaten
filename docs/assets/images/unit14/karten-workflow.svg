<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-labelledby="t d"><title id="t">Workflow von der Fragestellung zur dokumentierten Karte</title><desc id="d">Eine Prozesskette verbindet Zielgruppe, Datenprüfung, Analyse, Symbolisierung, Klassifizierung, Layout, Export und Interpretation.</desc><rect width="1000" height="470" fill="#f7f8fa"/><g font-family="sans-serif" fill="#263238"><text x="35" y="45" font-size="28" font-weight="700">Von der Fragestellung zur belastbaren Karte</text><g font-size="17" text-anchor="middle"><g fill="#e3f2fd" stroke="#1565c0" stroke-width="3"><rect x="35" y="95" width="205" height="90" rx="10"/><rect x="278" y="95" width="205" height="90" rx="10"/><rect x="521" y="95" width="205" height="90" rx="10"/><rect x="764" y="95" width="205" height="90" rx="10"/></g><text x="138" y="135">Fragestellung</text><text x="138" y="162">+ Zielgruppe</text><text x="381" y="135">Daten auswählen</text><text x="381" y="162">+ prüfen</text><text x="624" y="135">analysieren</text><text x="624" y="162">+ dokumentieren</text><text x="867" y="135">symbolisieren</text><text x="867" y="162">+ klassifizieren</text><g fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"><rect x="157" y="255" width="205" height="90" rx="10"/><rect x="400" y="255" width="205" height="90" rx="10"/><rect x="643" y="255" width="205" height="90" rx="10"/></g><text x="260" y="295">Layout erstellen</text><text x="260" y="322">+ prüfen</text><text x="503" y="295">PDF und PNG</text><text x="503" y="322">exportieren</text><text x="746" y="295">interpretieren</text><text x="746" y="322">+ Grenzen nennen</text></g><g fill="#1565c0"><path d="m240 126 30 15-30 15z"/><path d="m483 126 30 15-30 15z"/><path d="m726 126 30 15-30 15z"/></g><path d="M867 185v45H260v18" fill="none" stroke="#2e7d32" stroke-width="7"/><g fill="#2e7d32"><path d="m245 230 15 28 15-28z"/><path d="m362 285 30 15-30 15z"/><path d="m605 285 30 15-30 15z"/></g><text x="130" y="420" font-size="19" font-weight="700">Jede sichtbare Gestaltung ist eine fachliche Entscheidung und muss zur Aussage passen.</text></g></svg>
