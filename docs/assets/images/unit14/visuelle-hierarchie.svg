<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" role="img" aria-labelledby="title desc">
  <title id="title">Visuelle Hierarchie bei gleichem Kartenausschnitt</title>
  <desc id="desc">Zwei schematische Karten verwenden dieselben acht Punkte, denselben Fluss und dieselben Höhenlinien. Links konkurrieren ein dunkler Hintergrund und ein breiter Fluss mit den Punkten. Rechts treten heller Hintergrund und schmaler Fluss zurück, sodass die kontrastreichen Punkte zuerst auffallen.</desc>
  <rect width="1000" height="480" fill="#f7f8fa"/>
  <g font-family="sans-serif" fill="#263238">
    <text x="35" y="42" font-size="27" font-weight="700">Gleiche Daten, andere Aufmerksamkeit</text>
    <text x="55" y="82" font-size="20" font-weight="700">Hintergrund dominiert</text>
    <text x="545" y="82" font-size="20" font-weight="700">Hauptinformation dominiert</text>
    <g transform="translate(55 100)">
      <rect width="390" height="270" fill="#557a5b" stroke="#455a64" stroke-width="2"/>
      <g fill="none" stroke="#263238" stroke-width="3" opacity=".8"><path d="M15 65Q95 20 175 62T375 45"/><path d="M5 120Q100 70 185 118T385 92"/><path d="M5 190Q100 135 190 185T385 150"/><path d="M15 245Q100 190 205 235T380 210"/></g>
      <path d="M25 10Q140 75 115 145T220 260" fill="none" stroke="#005b96" stroke-width="18"/>
      <g fill="#6d1b7b" stroke="#263238" stroke-width="1"><circle cx="80" cy="70" r="8"/><circle cx="165" cy="55" r="8"/><circle cx="250" cy="90" r="8"/><circle cx="320" cy="65" r="8"/><circle cx="105" cy="190" r="8"/><circle cx="195" cy="155" r="8"/><circle cx="285" cy="205" r="8"/><circle cx="345" cy="165" r="8"/></g>
      <text x="15" y="297" font-size="16">Dunkle Linien und Flächen</text>
      <text x="15" y="318" font-size="16">konkurrieren mit den Punkten.</text>
    </g>
    <g transform="translate(545 100)">
      <rect width="390" height="270" fill="#eef1ec" stroke="#455a64" stroke-width="2"/>
      <g fill="none" stroke="#b0b8b0" stroke-width="1.5"><path d="M15 65Q95 20 175 62T375 45"/><path d="M5 120Q100 70 185 118T385 92"/><path d="M5 190Q100 135 190 185T385 150"/><path d="M15 245Q100 190 205 235T380 210"/></g>
      <path d="M25 10Q140 75 115 145T220 260" fill="none" stroke="#8ab6cf" stroke-width="5"/>
      <g fill="#7f0000" stroke="#fff" stroke-width="3"><circle cx="80" cy="70" r="10"/><circle cx="165" cy="55" r="10"/><circle cx="250" cy="90" r="10"/><circle cx="320" cy="65" r="10"/><circle cx="105" cy="190" r="10"/><circle cx="195" cy="155" r="10"/><circle cx="285" cy="205" r="10"/><circle cx="345" cy="165" r="10"/></g>
      <text x="15" y="297" font-size="16">Heller Kontext und Kontrast lenken</text>
      <text x="15" y="318" font-size="16">den Blick auf die Punkte.</text>
    </g>
    <text x="55" y="456" font-size="16" fill="#455a64">Schematischer Vergleich: Ausschnitt, Punktpositionen, Fluss und Höhenlinien sind in beiden Karten identisch.</text>
  </g>
</svg>
